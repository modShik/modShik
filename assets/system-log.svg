<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img" aria-label="Terminal: modshik --status. Boot sequence completed. Searching for the next problem to solve. Building things. Learning continuously. System remains operational.">
  <title>$ modshik --status</title>

  <defs>
    <linearGradient id="logBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="logRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17253C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#17253C" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="758.5" height="242.5" rx="10" fill="url(#logBg)" stroke="#17253C" stroke-width="1.5"/>

  <!-- corner ticks -->
  <g fill="none" stroke="#3DDC84" stroke-width="1.5" opacity="0.55">
    <path d="M 14,30 L 14,14 L 30,14"/>
    <path d="M 730,214 L 746,214 L 746,230"/>
  </g>

  <!-- header row -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="40" y="38" font-size="13" letter-spacing="3" fill="#5C7091">SYSTEM_LOG</text>
    <text x="702" y="38" font-size="12" letter-spacing="2" fill="#3DDC84" text-anchor="end">OPERATIONAL</text>
    <circle cx="722" cy="33" r="4" fill="#3DDC84">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="40" y="54" width="680" height="1" fill="url(#logRule)"/>

  <!-- log body -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
    <text x="40" y="90"><tspan fill="#3DDC84">$ </tspan><tspan fill="#E9F0F8">modshik --status</tspan></text>
    <text x="40" y="122"><tspan fill="#2E9BFF">&gt; </tspan><tspan fill="#8AA0BF">Boot sequence completed.</tspan></text>
    <text x="40" y="148"><tspan fill="#2E9BFF">&gt; </tspan><tspan fill="#8AA0BF">Searching for the next problem to solve...</tspan></text>
    <text x="40" y="174"><tspan fill="#2E9BFF">&gt; </tspan><tspan fill="#8AA0BF">Building things.</tspan></text>
    <text x="40" y="200"><tspan fill="#2E9BFF">&gt; </tspan><tspan fill="#8AA0BF">Learning continuously.</tspan></text>
    <text x="40" y="226"><tspan fill="#2E9BFF">&gt; </tspan><tspan fill="#8AA0BF">System remains operational.</tspan><tspan fill="#3DDC84"> _<animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
